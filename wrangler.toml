name = "robinhood-chain-terminal"
main = "src/worker.js"
compatibility_date = "2026-08-25"

[assets]
directory = "public"

[vars]
CHAIN_NAME = "Robinhood Chain"
CHAIN_ID = "4663"
# Set RPC_URL as a secret for deployment. Never commit credentials.

[[d1_databases]]
binding = "DB"
database_name = "robinhood-chain-terminal"
database_id = "12128e71-0502-4a3b-9343-08aeb350eb38"
migrations_dir = "migrations"

[triggers]
crons = ["*/1 * * * *"]
